[project]
name = "squadpy"
version = "0.1.0"
description = "Python-based Squad game server management framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["squadpy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
