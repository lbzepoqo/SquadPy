[project]
name = "squadpy"
version = "0.1.0"
description = "Python-based Squad game server management framework"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "discord.py>=2.3",
    "asyncssh>=2.14",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.setuptools.packages.find]
include = ["squadpy*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning:discord.player",
]
